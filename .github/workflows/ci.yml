name: CI

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python3 tests/run_tests.py
      - run: python3 tests/test_plugin_registry.py
      - run: python3 tests/test_plugin_runtime.py
      - run: python3 tests/test_migration_helper.py
      - run: python3 tests/test_update_monitor.py
      - run: python3 tests/test_export_source.py
      - run: python3 scripts/export_source.py "$RUNNER_TEMP/inference-dock-source.tar.gz"
      - run: tar -tzf "$RUNNER_TEMP/inference-dock-source.tar.gz" | grep -q 'inference-dock/README.zh-CN.md'
  menu-and-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: swift build
      - run: sh scripts/acceptance.sh
